<!doctype html>
<html lang="zh-CN">

<meta name="theme-color" content="#100D16" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10m0 0l-3.6-3.6M12 14l3.6-3.6M5 19h14"/></symbol>

<header class="topbar">
  <a class="brand" href="#/" aria-label="回到首页">
    <span class="brand__mark">Iwara</span>
    <span class="brand__sub">映像</span>
  </a>

  <form class="searchbar" id="global-search" role="search">
    <svg class="icon"><use href="#i-search"/></svg>
    <input id="global-search-input" type="search" name="q" placeholder="搜索作品、作者、标签…" autocomplete="off" enterkeyhint="search" />
    <kbd>/</kbd>
  </form>

  <nav class="topnav" id="topnav">
    <a href="#/" data-nav="home"><svg class="icon"><use href="#i-grid"/></svg><span>首页</span></a>
    <a href="#/subscriptions" data-nav="subscriptions"><svg class="icon"><use href="#i-rss"/></svg><span>订阅</span></a>
    <a href="#/images" data-nav="images"><svg class="icon"><use href="#i-list"/></svg><span>图库</span></a>
    <a href="#/forum" data-nav="forum"><svg class="icon"><use href="#i-forum"/></svg><span>论坛</span></a>
  </nav>

  <div class="topbar__end">
    <button class="themebtn" id="theme-button" type="button" aria-label="切换配色" title="切换配色">
      <svg class="icon"><use href="#i-moon"/></svg>
    </button>
    <div class="menu" id="account-menu">
      <button class="account" id="account-button" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="account__avatar" id="account-avatar"><svg class="icon"><use href="#i-user"/></svg></span>
        <span class="account__name" id="account-name">未登录</span>
      </button>
      <div class="menu__panel" id="account-panel" role="menu" hidden>
        <div class="menu__head" id="account-head"></div>
        <a role="menuitem" href="#/subscriptions"><svg class="icon"><use href="#i-rss"/></svg>我的订阅</a>
        <a role="menuitem" href="#/library/following" id="following-link"><svg class="icon"><use href="#i-user"/></svg>我的关注</a>
        <a role="menuitem" href="#/library/favorites"><svg class="icon"><use href="#i-star"/></svg>我的收藏</a>
        <a role="menuitem" href="#/library/history"><svg class="icon"><use href="#i-clock"/></svg>观看历史</a>
        <a role="menuitem" href="#/settings"><svg class="icon"><use href="#i-settings"/></svg>设置</a>
        <button role="menuitem" id="logout-button" type="button" hidden><svg class="icon"><use href="#i-logout"/></svg>退出登录</button>
        <a role="menuitem" href="#/login" id="login-link"><svg class="icon"><use href="#i-shield"/></svg>登录 Iwara</a>
      </div>
    </div>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<footer class="sitefoot">
  <span>内容来自 <strong>iwara.tv</strong>，本站只做加速转发，不存储任何作品。</span>
  <a href="#/about">关于与部署</a>
</footer>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal" id="modal" hidden></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
